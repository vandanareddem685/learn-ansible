- name: variable preferences
  hosts: local
  connection: local
  vars:
    course: ansible from PLAY
  vars_files:
  - course.yaml
  vars_prompt:
  - name: course
    prompt: please enter your course
    private: false
  tasks:
  - name: print course
    vars:
      course: ansible from task
    debug:
      msg: "course is {{ course }}"